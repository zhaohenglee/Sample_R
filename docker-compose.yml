services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U finance -d finance"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://finance:finance@db:5432/finance
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Calls /api/sync every 6 hours. Replace with a real cron if you prefer.
  sync:
    image: curlimages/curl:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      app:
        condition: service_healthy
    command: >
      sh -c 'while true; do sleep 21600;
      curl -fsS -X POST -H "Authorization: Bearer $$SYNC_SECRET" http://app:3000/api/sync || true;
      done'

  # Daily gzipped pg_dump to ./backups with 14 day retention. See
  # scripts/backup.sh and the "Restore a backup" section in README.md.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: finance
      PGPASSWORD: finance
      PGDATABASE: finance
      BACKUP_DIR: /backups
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "-c"]
    command: >
      "while true; do /scripts/backup.sh; sleep 86400; done"

volumes:
  pgdata:
